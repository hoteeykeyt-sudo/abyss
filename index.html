<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abyss dlc — доминация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #030205;
            --primary-accent: #6b21a8;
            --secondary-accent: #3730a3;
            --card-bg: rgba(7, 5, 14, 0.85);
            --card-border: rgba(107, 33, 168, 0.2);
            --text-main: #f1f5f9;
            --text-dim: #64748b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            perspective: 1200px;
            padding: 24px;
        }

        /* Динамические фоновые световые сферы (затемнены) */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }

        .glow-1 {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, #581c87 0%, transparent 70%);
            top: 20%;
            left: 20%;
            animation: pulseOrb 12s infinite alternate ease-in-out;
        }

        .glow-2 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, #312e81 0%, transparent 70%);
            bottom: 15%;
            right: 25%;
            animation: pulseOrb 14s infinite alternate-reverse ease-in-out;
        }

        .glow-3 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #831843 0%, transparent 70%);
            top: 60%;
            left: 60%;
            animation: pulseOrb 10s infinite alternate ease-in-out;
            opacity: 0.15;
        }

        /* Кибернетическая сетка */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            z-index: 1;
            pointer-events: none;
        }

        /* Карточка с эффектом стекла */
        .card-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 44px 36px;
            text-align: center;
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.95),
                0 0 30px -10px rgba(88, 28, 135, 0.2),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        /* Верхняя грань */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #a855f7, transparent);
            filter: blur(0.5px);
            opacity: 0.5;
        }

        /* Бейдж статуса */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #a855f7;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 24px;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            background: #16a34a;
            border-radius: 50%;
            box-shadow: 0 0 8px #16a34a;
            animation: blink 2.5s infinite;
        }

        /* Типографика */
        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 27px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            line-height: 1.25;
            margin-bottom: 12px;
            background: linear-gradient(145deg, #ffffff 40%, #a855f7 80%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Список возможностей (чипы) */
        .features-grid {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .feature-tag {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Темная кнопка */
        .btn-download {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 17px 24px;
            font-family: 'Unbounded', sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #581c87, #3730a3);
            border-radius: 16px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.8);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            cursor: pointer;
        }

        /* Бегущий блик при наведении */
        .btn-download::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255, 255, 255, 0.15), 
                transparent
            );
            transition: 0.5s;
        }

        .btn-download:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 28px -6px rgba(88, 28, 135, 0.6);
            background: linear-gradient(135deg, #6b21a8, #4338ca);
            border-color: rgba(168, 85, 247, 0.5);
        }

        .btn-download:hover::before {
            left: 100%;
        }

        .btn-download:active {
            transform: translateY(1px) scale(0.99);
        }

        .btn-icon {
            display: flex;
            transition: transform 0.3s ease;
        }

        .btn-download:hover .btn-icon {
            transform: translateY(2px);
        }

        /* Нижний статус */
        .footer-note {
            margin-top: 18px;
            font-size: 11px;
            color: #475569;
            letter-spacing: 0.3px;
        }

        /* Анимации */
        @keyframes pulseOrb {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.2) translate(40px, -20px); }
            100% { transform: scale(0.9) translate(-20px, 30px); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 24px;
            }
            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>
    <div class="grid-overlay"></div>

    <div class="card-wrapper" id="cardContainer">
        <div class="card">
            <div class="badge">
                <span class="badge-dot"></span>
                Status: Undetected
            </div>
            
            <h1>abyss dlc<br>доминация</h1>
            <p class="subtitle">Лучшие байпассы и обходы</p>
            
            <div class="features-grid">
                <div class="feature-tag">⚡ Fast Inject</div>
                <div class="feature-tag">🛡 Anti-Cheat Bypass</div>
                <div class="feature-tag">🎮 24/7 Support</div>
            </div>

            <a href="https://t.me/abyssdlc" target="_blank" class="btn-download">
                <span class="btn-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </span>
                <span>СКАЧАТЬ</span>
            </a>

            <div class="footer-note">
                Версия 2.4 • Автоматическое обновление
            </div>
        </div>
    </div>

    <!-- Интерактивный 3D-наклон карточки -->
    <script>
        const card = document.getElementById('cardContainer');

        window.addEventListener('mousemove', (e) => {
            const { innerWidth, innerHeight } = window;
            const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
            const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

            card.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 8}deg)`;
        });

        window.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });
    </script>
</body>
</html>
