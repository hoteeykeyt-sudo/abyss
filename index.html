<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abyss dlc — доминация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #030712;
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent-blue: #2563eb;
            --card-surface: rgba(7, 15, 33, 0.82);
            --border-glow: rgba(0, 242, 254, 0.35);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            perspective: 1200px;
            overflow-x: hidden;
            position: relative;
        }

        /* Интерактивный свет курсора */
        .cursor-light {
            position: fixed;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.14) 0%, rgba(37, 99, 235, 0.05) 50%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
            transition: transform 0.08s ease-out;
        }

        /* Фон: холст для плавающих частиц */
        #particlesCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Неоновая сетка с 3D-эффектом бесконечности */
        .grid-overlay {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.09) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.09) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black 25%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at center, black 25%, transparent 70%);
            z-index: 1;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* Фоновые атмосферные сферы */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }

        .glow-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #0284c7 0%, transparent 70%);
            top: 15%;
            left: 15%;
            animation: floatOrb 14s infinite alternate ease-in-out;
        }

        .glow-2 {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, #3b82f6 0%, #1e1b4b 60%, transparent 75%);
            bottom: 10%;
            right: 15%;
            animation: floatOrb 18s infinite alternate-reverse ease-in-out;
        }

        /* Экран приветствия */
        .intro-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .intro-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .btn-intro {
            position: relative;
            padding: 22px 52px;
            font-family: 'Unbounded', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: 1px solid rgba(0, 242, 254, 0.6);
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            animation: pulseBtn 3s infinite ease-in-out;
        }

        .btn-intro::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.3) 50%, transparent 60%);
            transform: rotate(25deg);
            animation: lightPass 3.5s infinite linear;
        }

        .btn-intro:hover {
            transform: scale(1.08);
            box-shadow: 0 0 60px rgba(0, 242, 254, 0.8);
            border-color: #00f2fe;
        }

        /* Контейнер страницы */
        .page-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            z-index: 10;
        }

        .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            width: 100%;
            max-width: 980px;
            pointer-events: none;
        }

        /* Каскадная анимация появления при открытии */
        .main-container .side-card-left,
        .main-container .card-wrapper,
        .main-container .side-card-right {
            opacity: 0;
            transform: translateY(40px) scale(0.9);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .main-container.visible {
            pointer-events: auto;
        }

        .main-container.visible .side-card-left {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition-delay: 0.1s;
        }

        .main-container.visible .card-wrapper {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition-delay: 0.25s;
        }

        .main-container.visible .side-card-right {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition-delay: 0.4s;
        }

        /* Боковые карточки с плавающей левитацией */
        .side-card {
            position: relative;
            background: var(--card-surface);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 30px 24px;
            min-width: 195px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .side-card-left {
            animation: sideFloatLeft 6s infinite ease-in-out;
        }

        .side-card-right {
            animation: sideFloatRight 6s infinite ease-in-out 1s;
        }

        .side-card:hover {
            border-color: rgba(0, 242, 254, 0.75);
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 242, 254, 0.3);
        }

        .side-icon-box {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.12), rgba(37, 99, 235, 0.25));
            border: 1px solid rgba(0, 242, 254, 0.35);
            color: #38bdf8;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
            animation: pulseIcon 4s infinite ease-in-out;
        }

        .side-card .title {
            font-family: 'Unbounded', sans-serif;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #e2e8f0;
        }

        /* Центральная карточка и 3D-наклон */
        .card-wrapper {
            position: relative;
            width: 100%;
            max-width: 460px;
            transform-style: preserve-3d;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1);
        }

        /* Анимированная неоновая бегущая рамка вокруг карточки */
        .card-glow-border {
            position: relative;
            border-radius: 34px;
            padding: 1.5px;
            background: conic-gradient(from var(--border-angle), transparent 25%, #00f2fe 50%, #2563eb 75%, transparent 100%);
            animation: spinBorder 7s linear infinite;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.15);
        }

        @property --border-angle {
            syntax: '<angle>';
            inherits: false;
            initial-value: 0deg;
        }

        @keyframes spinBorder {
            0% { --border-angle: 0deg; }
            100% { --border-angle: 360deg; }
        }

        .card {
            position: relative;
            background: var(--card-surface);
            backdrop-filter: blur(36px);
            -webkit-backdrop-filter: blur(36px);
            border-radius: 33px;
            padding: 48px 38px 40px;
            text-align: center;
            box-shadow: 
                0 30px 70px -15px rgba(0, 0, 0, 0.95),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
            overflow: hidden;
            animation: cardLevitate 5s infinite ease-in-out;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, #00f2fe, #3b82f6, transparent);
            filter: drop-shadow(0 0 8px #00f2fe);
        }

        /* Бейдж статуса */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #4ade80;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 26px;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.15);
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulseDot 1.8s infinite;
        }

        /* Типографика с переливающимся сиянием */
        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 29px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            line-height: 1.25;
            margin-bottom: 14px;
            background: linear-gradient(135deg, #ffffff 20%, #38bdf8 65%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 242, 254, 0.25);
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 14.5px;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 34px;
        }

        /* Кнопка действия */
        .btn-download {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 24px;
            font-family: 'Unbounded', sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%);
            border-radius: 18px;
            border: 1px solid rgba(0, 242, 254, 0.45);
            box-shadow: 0 12px 30px -8px rgba(2, 132, 199, 0.6), 0 0 24px rgba(0, 242, 254, 0.35);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            cursor: pointer;
        }

        .btn-download::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.6s ease;
        }

        .btn-download:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: #00f2fe;
            box-shadow: 0 16px 40px -6px rgba(2, 132, 199, 0.85), 0 0 36px rgba(0, 242, 254, 0.6);
        }

        .btn-download:hover::before {
            left: 100%;
        }

        .btn-icon {
            display: flex;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-download:hover .btn-icon {
            transform: translateY(3px) scale(1.1);
        }

        /* Ключевые кадры анимаций */
        @keyframes floatOrb {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.15) translate(30px, -20px); }
            100% { transform: scale(0.95) translate(-25px, 25px); }
        }

        @keyframes cardLevitate {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }

        @keyframes sideFloatLeft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes sideFloatRight {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(6px); }
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(0, 242, 254, 0.3)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.65)); }
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.4; }
        }

        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 0 35px rgba(0, 242, 254, 0.35); }
            50% { box-shadow: 0 0 50px rgba(0, 242, 254, 0.65); }
        }

        @keyframes lightPass {
            0% { transform: translate(-100%, -100%) rotate(25deg); }
            20%, 100% { transform: translate(100%, 100%) rotate(25deg); }
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                gap: 16px;
            }
            .side-card {
                width: 100%;
                max-width: 460px;
                flex-direction: row;
                justify-content: flex-start;
                padding: 16px 20px;
                gap: 16px;
            }
            .side-card .title {
                font-size: 12px;
            }
            .card {
                padding: 38px 24px 32px;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Фоновые эффекты и Canvas частиц -->
    <canvas id="particlesCanvas"></canvas>
    <div class="cursor-light" id="cursorLight"></div>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="grid-overlay"></div>

    <!-- Входной экран -->
    <div class="intro-screen" id="introScreen">
        <button class="btn-intro" onclick="showMainContent()">ОЗНАКОМИТЬСЯ</button>
    </div>

    <!-- Основной интерфейс -->
    <div class="page-wrapper">
        <div class="main-container" id="mainContainer">
            
            <!-- Левая карточка -->
            <div class="side-card side-card-left">
                <div class="side-icon-box">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </div>
                <span class="title">FAST INJECT</span>
            </div>

            <!-- Центральный блок с вращающейся градиентной рамкой -->
            <div class="card-wrapper" id="cardContainer">
                <div class="card-glow-border">
                    <div class="card">
                        <div class="badge">
                            <span class="badge-dot"></span>
                            Status: Undetected
                        </div>
                        
                        <h1>abyss dlc<br>доминация</h1>
                        <p class="subtitle">Лучшие байпассы и обходы</p>

                        <a href="https://t.me/abyssdlc" target="_blank" class="btn-download">
                            <span class="btn-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="7 10 12 15 17 10"/>
                                    <line x1="12" y1="15" x2="12" y2="3"/>
                                </svg>
                            </span>
                            <span>СКАЧАТЬ</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Правая карточка -->
            <div class="side-card side-card-right">
                <div class="side-icon-box">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                </div>
                <span class="title">ANTICHEAT BYPASS</span>
            </div>

        </div>
    </div>

    <script>
        const introScreen = document.getElementById('introScreen');
        const mainContainer = document.getElementById('mainContainer');
        const card = document.getElementById('cardContainer');
        const cursorLight = document.getElementById('cursorLight');

        function showMainContent() {
            introScreen.classList.add('hidden');
            mainContainer.classList.add('visible');
        }

        // Параллакс 3D и мягкий трекинг подсветки
        window.addEventListener('mousemove', (e) => {
            if (cursorLight) {
                cursorLight.style.left = `${e.clientX}px`;
                cursorLight.style.top = `${e.clientY}px`;
            }

            if (!mainContainer.classList.contains('visible')) return;

            const { innerWidth, innerHeight } = window;
            const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
            const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

            if (card) {
                card.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 8}deg)`;
            }
        });

        window.addEventListener('mouseleave', () => {
            if (card) {
                card.style.transform = 'rotateY(0deg) rotateX(0deg)';
            }
        });

        // Генерация и физика дрейфующих частиц
        const canvas = document.getElementById('particlesCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.6;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.alpha = Math.random() * 0.5 + 0.2;
                this.hue = Math.random() > 0.4 ? 188 : 215; // оттенок бирюзы и синего
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 65%, ${this.alpha})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 50%, 0.8)`;
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 45; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
