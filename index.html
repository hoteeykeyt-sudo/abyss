<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abyss dlc — доминация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #07060b;
            --primary-accent: #a855f7;
            --secondary-accent: #6366f1;
            --cyan-accent: #00f2fe;
            --card-bg: rgba(14, 11, 24, 0.7);
            --card-border: rgba(168, 85, 247, 0.25);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            perspective: 1200px;
            padding: 24px;
        }

        /* Динамические фоновые световые сферы */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }

        .glow-1 {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
            top: 20%;
            left: 20%;
            animation: pulseOrb 12s infinite alternate ease-in-out;
        }

        .glow-2 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, #4f46e5 0%, transparent 70%);
            bottom: 15%;
            right: 25%;
            animation: pulseOrb 14s infinite alternate-reverse ease-in-out;
        }

        .glow-3 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            top: 60%;
            left: 60%;
            animation: pulseOrb 10s infinite alternate ease-in-out;
            opacity: 0.3;
        }

        /* Кибернетическая сетка и радиальное затемнение */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
            z-index: 1;
            pointer-events: none;
        }

        /* Карточка с эффектом стекла */
        .card-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 44px 36px;
            text-align: center;
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.8),
                0 0 45px -10px rgba(139, 92, 246, 0.25),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }

        /* Верхняя светящаяся грань */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c084fc, transparent);
            filter: blur(0.5px);
        }

        /* Бейдж статуса */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #d8b4fe;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 24px;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e, 0 0 18px #22c55e;
            animation: blink 2.5s infinite;
        }

        /* Типографика */
        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 27px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            line-height: 1.25;
            margin-bottom: 12px;
            background: linear-gradient(145deg, #ffffff 30%, #c084fc 70%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Список возможностей (чипы) */
        .features-grid {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .feature-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 500;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Кнопка с переливающимся градиентом */
        .btn-download {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 17px 24px;
            font-family: 'Unbounded', sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border-radius: 16px;
            border: none;
            box-shadow: 0 12px 30px -6px rgba(124, 58, 237, 0.6);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            cursor: pointer;
        }

        /* Бегущий блик при наведении */
        .btn-download::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255, 255, 255, 0.25), 
                transparent
            );
            transition: 0.5s;
        }

        .btn-download:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 18px 36px -6px rgba(124, 58, 237, 0.85);
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
        }

        .btn-download:hover::before {
            left: 100%;
        }

        .btn-download:active {
            transform: translateY(1px) scale(0.99);
        }

        .btn-icon {
            display: flex;
            transition: transform 0.3s ease;
        }

        .btn-download:hover .btn-icon {
            transform: translateY(-2px) rotate(-10deg);
        }

        /* Нижний статус */
        .footer-note {
            margin-top: 18px;
            font-size: 11px;
            color: #64748b;
            letter-spacing: 0.3px;
        }

        /* Анимации */
        @keyframes pulseOrb {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.2) translate(40px, -20px); }
            100% { transform: scale(0.9) translate(-20px, 30px); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 24px;
            }
            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>
    <div class="grid-overlay"></div>

    <div class="card-wrapper" id="cardContainer">
        <div class="card">
            <div class="badge">
                <span class="badge-dot"></span>
                Status: Undetected
            </div>
            
            <h1>abyss dlc<br>доминация</h1>
            <p class="subtitle">Максимальный контроль и плавное преимущество в каждом матче</p>
            
            <div class="features-grid">
                <div class="feature-tag">⚡ Fast Inject</div>
                <div class="feature-tag">🛡️️ Anti-Cheat Bypass</div>
                <div class="feature-tag">🎮 24/7 Support</div>
            </div>

            <a href="https://t.me/abyssdlc" target="_blank" class="btn-download">
                <span class="btn-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
                        <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
                    </svg>
                </span>
                <span>ПОЛУЧИТЬ ДОСТУП</span>
            </a>

            <div class="footer-note">
                Версия 2.4 • Автоматическое обновление
            </div>
        </div>
    </div>

    <!-- Интерактивный 3D-наклон карточки за курсором -->
    <script>
        const card = document.getElementById('cardContainer');

        window.addEventListener('mousemove', (e) => {
            const { innerWidth, innerHeight } = window;
            const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
            const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

            card.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 8}deg)`;
        });

        window.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });
    </script>
</body>
</html>
