<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abyss dlc - доминация</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background: #08070c;
            color: #ffffff;
        }

        /* Анимированные фиолетово-синие неоновые сферы на фоне */
        .glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }

        .glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(72, 52, 212, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: 10%;
            right: 25%;
            z-index: 0;
            animation: floatGlow2 10s ease-in-out infinite alternate;
        }

        /* Геометрическая сетка поверх фона */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 45px 45px;
            z-index: 1;
        }

        /* Главная стеклянная карточка меню */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(18, 16, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 32px;
            padding: 48px 40px;
            text-align: center;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(138, 43, 226, 0.25);
            animation: fadeIn 0.8s ease-out;
        }

        /* Значок сверху */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid rgba(162, 155, 254, 0.4);
            color: #d6caef;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
        }

        /* Заголовок abyss dlc */
        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #b19ffb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        p {
            color: #a2a3b5;
            font-size: 14px;
            margin-bottom: 36px;
            line-height: 1.5;
        }

        /* Фиолетовая кнопка "СКАЧАТЬ" */
        .btn-download {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px;
            font-family: 'Unbounded', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #8a2be2, #4834d4);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #9d3bf0, #5842e3);
            box-shadow: 0 15px 45px rgba(138, 43, 226, 0.8);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        /* Анимации движения свечения */
        @keyframes floatGlow {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-45%, -45%) scale(1.15); }
        }

        @keyframes floatGlow2 {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="bg-grid"></div>

    <div class="card">
        <div class="badge">
            <span class="badge-dot"></span>
            DLC Edition
        </div>
        
        <h1>abyss dlc<br>доминация</h1>
        <p>Получи полное преимущество в игре прямо сейчас</p>
        
        <a href="https://t.me/abyssdlc" target="_blank" class="btn-download">
            <span>🚀 СКАЧАТЬ</span>
        </a>
    </div>

</body>
</html>
