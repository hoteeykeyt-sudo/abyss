        *, *::before, *::after {

        :root {
            --bg-color: #030712;

            --card-bg: rgba(6, 12, 26, 0.92);

            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {

            min-height: 100vh;

        /* Синие фоновые сферы свечения */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.45;
            pointer-events: none;
            z-index: 1;
        }

        .glow-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #0284c7 0%, transparent 70%);
            top: 20%;
            left: 20%;
            animation: pulseOrb 12s infinite alternate ease-in-out;
        }

        .glow-2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #1d4ed8 0%, transparent 70%);
            bottom: 15%;
            right: 25%;
            animation: pulseOrb 14s infinite alternate-reverse ease-in-out;
        }

        /* Неоновая синяя сетка на фоне */
        .grid-overlay {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.12) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 70%);
            z-index: 2;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        /* Экран входа */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            transition: opacity 0.5s ease;
        }

        .intro-screen.hide {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        .btn-intro {
            padding: 20px 48px;
            font-family: 'Unbounded', sans-serif;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            background: linear-gradient(135deg, #0284c7, #1d4ed8);
            border: 1px solid rgba(0, 242, 254, 0.5);
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.4);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-intro:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.7);
        }

        /* Основной контейнер */
        .main-container {
            position: relative;
            z-index: 10;
            display: none; /* Скрыт по умолчанию до клика */
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 960px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .main-container.show {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        /* Боковые окошки */
        .side-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            min-width: 160px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .side-card .icon {
            font-size: 22px;
        }

        .side-card .title {
            font-family: 'Unbounded', sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #38bdf8;
        }
