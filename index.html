<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abyss dlc - доминация</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background: #000;
            color: #ffffff;
        }

        /* Атмосферный ночной фон Minecraft */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1627856013091-fed6e4e30025?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            filter: brightness(0.4) contrast(1.1);
            transform: scale(1.05);
            animation: pulseBg 12s infinite alternate ease-in-out;
            z-index: -2;
        }

        /* Затемнение и неоновая виньетка */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(138, 43, 226, 0.15) 0%, rgba(5, 5, 10, 0.85) 100%);
            z-index: -1;
        }

        /* Главная карточка с Glassmorphism эффектом */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(15, 15, 25, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 28px;
            padding: 50px 40px;
            text-align: center;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.05);
            animation: fadeIn 1s ease-out;
        }

        /* Иконка с неоном */
        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px auto;
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Заголовок abyss dlc - доминация */
        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 30%, #b19ffb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
        }

        p {
            color: #a0a5c0;
            font-size: 15px;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        /* Фиолетовая неоновая кнопка «Скачать» */
        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px;
            font-family: 'Unbounded', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #8a2be2, #5a189a);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .btn-download:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(138, 43, 226, 0.8);
            background: linear-gradient(135deg, #9d3bf0, #7b2cbf);
        }

        .btn-download:active {
            transform: translateY(0) scale(0.98);
        }

        /* Анимации */
        @keyframes pulseBg {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div class="card">
        <div class="icon">🌌</div>
        <h1>abyss dlc - доминация</h1>
        <p>Получи полное преимущество в игре прямо сейчас</p>
        
        <a href="https://t.me/abyssdlc" target="_blank" class="btn-download">
            <span>🚀 СКАЧАТЬ</span>
        </a>
    </div>

</body>
</html>
